name: Monitor de Legislação Ambiental

on:
  schedule:
    # Executa de segunda a sexta-feira às 10:00 UTC (07:00 Horário de Brasília)
    - cron: '0 10 * * 1-5'
  # Permite disparar manualmente o fluxo direto na interface do GitHub para testes
  workflow_dispatch:

jobs:
  executar-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Script de Monitoramento
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
